<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abschlussdiagnose – Geraden im Raum</title>
<style>
  :root { --scale: 1; --navy: #1f3a68; --green: #1b7f3b; --red: #c62828; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff; color: #111;
  }

  /* ---------- Kopfzeile ---------- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4vw; background: var(--navy); color: #fff; font-size: 20px;
  }
  header .title { font-weight: 700; }
  header .counter { font-weight: 600; opacity: .9; }

  /* ---------- Inhalt (skaliert) ---------- */
  main {
    flex: 1; overflow-y: auto;
    font-size: calc(clamp(22px, 2.3vw, 46px) * var(--scale));
    padding: 1em 4vw 2em;
  }
  .wrap { max-width: 1600px; margin: 0 auto; }
  .topic {
    font-size: .62em; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: #5a6475; margin-bottom: .3em;
  }
  .stem { font-size: 1.08em; font-weight: 600; line-height: 1.45; margin-bottom: .9em; }
  .opts { display: flex; flex-direction: column; gap: .45em; }

  .opt-btn {
    display: flex; align-items: center; gap: .7em; width: 100%;
    font: inherit; color: inherit; text-align: left; line-height: 1.4;
    background: #f3f5f9; border: 3px solid #cdd5e3; border-radius: .4em;
    padding: .4em .7em; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .opt-btn:hover { border-color: var(--navy); }
  .opt-btn:focus-visible { outline: 4px solid #f2b705; outline-offset: 2px; }
  .badge {
    flex: none; width: 1.8em; height: 1.8em; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700;
    background: var(--navy); color: #fff;
  }
  .opt.correct .opt-btn { border-color: var(--green); background: #e6f5ea; }
  .opt.correct .badge   { background: var(--green); }
  .opt.wrong .opt-btn   { border-color: var(--red); background: #fdecec; }
  .opt.wrong .badge     { background: var(--red); }

  .fb {
    margin: .35em 0 .25em 2.5em; padding: .55em .9em;
    border-left: .3em solid; border-radius: .3em;
    font-size: .86em; line-height: 1.5;
  }
  .fb.new { animation: fade .25s ease-out; }
  .fb.correct { background: #e6f5ea; border-color: var(--green); }
  .fb.wrong   { background: #fdecec; border-color: var(--red); }
  .verdict { font-weight: 800; margin-right: .35em; }
  .fb.correct .verdict { color: var(--green); }
  .fb.wrong .verdict   { color: var(--red); }
  @keyframes fade { from { opacity: 0; transform: translateY(-.2em); } to { opacity: 1; transform: none; } }

  /* ---------- Mathe-Darstellung ---------- */
  .cv { display: inline-flex; vertical-align: middle; margin: 0 .12em; }
  .cv-in {
    display: inline-flex; flex-direction: column; align-items: center;
    padding: 0 .35em; line-height: 1.1; font-size: .82em;
    border-left: .09em solid currentColor; border-right: .09em solid currentColor;
    border-radius: .55em;
  }
  .vn { position: relative; display: inline-block; font-style: italic; }
  .vn::before {
    content: "\2192"; position: absolute; left: 50%; top: -.68em;
    transform: translateX(-50%); font-size: .7em; font-style: normal; line-height: 1;
  }
  .vn.two::before { transform: translateX(-50%) scaleX(1.9); }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .8em; line-height: 1.05; margin: 0 .1em; }
  .fr > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .1em; }
  i.var { font-family: "Cambria Math", "Times New Roman", serif; }

  /* ---------- Fußzeile ---------- */
  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 10px 4vw; border-top: 2px solid #e2e6ee; background: #f7f8fb; font-size: 20px;
  }
  .group { display: flex; align-items: center; gap: 8px; }
  footer button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--navy);
    background: #fff; border: 2px solid var(--navy); border-radius: 8px; padding: 8px 16px;
  }
  footer button:hover:not(:disabled) { background: var(--navy); color: #fff; }
  footer button:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 10px; }
  .dot {
    width: 18px; height: 18px; padding: 0 !important; border-radius: 50% !important;
    border: 2px solid var(--navy) !important; background: #fff;
  }
  .dot.active { background: var(--navy) !important; }
  #zoomLabel { min-width: 3.4em; text-align: center; font-weight: 600; }
</style>
</head>
<body>

<header>
  <span class="title">Abschlussdiagnose: Geraden im Raum</span>
  <span class="counter" id="counter"></span>
</header>

<main id="main"><div class="wrap" id="content"></div></main>

<footer>
  <div class="group">
    <button id="prev" title="Zurück (Pfeil links)">&larr; Zurück</button>
    <button id="next" title="Weiter (Pfeil rechts)">Weiter &rarr;</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="group">
    <button id="reset" title="Feedback dieser Frage ausblenden">Zurücksetzen</button>
    <button id="zoomOut" title="Schrift kleiner (−)">A−</button>
    <span id="zoomLabel">100 %</span>
    <button id="zoomIn" title="Schrift größer (+)">A+</button>
  </div>
</footer>

<script>
/* ---------- Hilfsfunktionen für Mathe ---------- */
const v  = (...c) => `<span class="cv"><span class="cv-in">${c.map(x => `<span>${x}</span>`).join("")}</span></span>`;
const n  = s => `<span class="vn${s.length > 1 ? " two" : ""}">${s}</span>`;
const f  = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const t  = `<i class="var">t</i>`;
const m  = "−"; // echtes Minuszeichen
const xv = n("x");

/* ---------- Fragen ---------- */
const questions = [
  {
    topic: "Frage 1 · Stützvektor und Richtungsvektor",
    stem: `Eine Gerade verläuft durch P(1|4|2) und Q(3|1|7).<br>Welche Gleichung beschreibt diese Gerade <u>nicht</u>?`,
    options: [
      { text: `${xv} = ${v(1,4,2)}&nbsp;+&nbsp;${t}&nbsp;· ${v(2,m+"3",5)}`, correct: false,
        fb: `Diese Gleichung beschreibt die Gerade sehr wohl. Der Stützvektor ist der Ortsvektor ${n("OP")} = ${v(1,4,2)}, der Richtungsvektor ist ${n("PQ")} = ${n("OQ")} ${m} ${n("OP")} = ${v(2,m+"3",5)}. Das ist die „Standard-Lösung“.` },
      { text: `${xv} = ${v(3,1,7)}&nbsp;+&nbsp;${t}&nbsp;· ${v(m+"2",3,m+"5")}`, correct: false,
        fb: `Auch diese Gleichung beschreibt die Gerade. Stützvektor ist ${n("OQ")}, und ${v(m+"2",3,m+"5")} = ${n("QP")} zeigt von Q nach P, also in die Gegenrichtung von ${n("PQ")}. Beides ist erlaubt.` },
      { text: `${xv} = ${v(1,4,2)}&nbsp;+&nbsp;${t}&nbsp;· ${v(4,m+"6",10)}`, correct: false,
        fb: `Auch diese Gleichung beschreibt die Gerade. ${v(4,m+"6",10)} = 2 ·&nbsp;${n("PQ")} zeigt in dieselbe Richtung, nur doppelt so lang. Jedes Vielfache von ${n("PQ")} (außer dem Nullvektor) ist ein gültiger Richtungsvektor.` },
      { text: `${xv} = ${v(1,4,2)}&nbsp;+&nbsp;${t}&nbsp;· ${v(3,1,7)}`, correct: true,
        fb: `${v(3,1,7)} = ${n("OQ")} ist der <b>Ortsvektor</b> von Q, nicht der Richtungsvektor von P nach Q. Richtig wäre ${n("PQ")} = ${n("OQ")} ${m} ${n("OP")} = ${v(2,m+"3",5)}. Probe: Damit Q herauskommt, bräuchtest du in der 1. Zeile ${t} = ${f(2,3)}, in der 2. Zeile ${t} = ${m}3. Q liegt also nicht auf dieser Geraden.` }
    ]
  },
  {
    topic: "Frage 2 · Punktprobe",
    stem: `Gegeben ist die Gerade g: ${xv} = ${v(2,m+"1",3)}&nbsp;+&nbsp;${t}&nbsp;· ${v(1,4,m+"2")}.<br>Liegt der Punkt R(5|11|${m}4) auf g?`,
    options: [
      { text: `Ja, denn aus 2&nbsp;+&nbsp;${t} = 5 folgt ${t} = 3.`, correct: false,
        fb: `Du hast nur die erste Zeile geprüft. Ein Punkt liegt erst dann auf der Geraden, wenn <b>ein und dasselbe ${t}</b> alle drei Gleichungen erfüllt.` },
      { text: `Nein, denn aus der z-Zeile folgt ${t} = 3,5 ≠ 3.`, correct: true,
        fb: `Die x- und y-Zeile liefern ${t} = 3, die z-Zeile liefert 3 ${m} 2${t} = ${m}4 ⇒ ${t} = 3,5. Es gibt kein gemeinsames ${t}, also liegt R nicht auf g. Merke: Bei der Punktprobe immer alle drei Zeilen prüfen!` },
      { text: `Ja, denn ${t} = 3 passt für x und y.`, correct: false,
        fb: `Fast! Zwei Zeilen reichen aber nicht. Setze ${t} = 3 in die z-Zeile ein: 3 ${m} 2 · 3 = ${m}3, nicht ${m}4. R liegt also nicht auf g.` },
      { text: `Nein, denn R ist nicht der Stützpunkt.`, correct: false,
        fb: `Die Antwort „Nein“ stimmt zufällig, die Begründung aber nicht. Auf einer Geraden liegen unendlich viele Punkte, nicht nur der Stützpunkt. Ob ein Punkt darauf liegt, entscheidest du mit der Punktprobe.` }
    ]
  },
  {
    topic: "Frage 3 · Gerade oder Strecke?",
    stem: `Die Gerade g: ${xv} = ${v(2,0,1)}&nbsp;+&nbsp;${t}&nbsp;· ${v(6,3,m+"3")} verläuft durch A(2|0|1) und B(8|3|${m}2).<br>Welcher Punkt liegt auf der <u>Strecke</u> AB?`,
    options: [
      { text: `(14 | 6 | ${m}5)`, correct: false,
        fb: `Dieser Punkt liegt auf der Geraden (${t} = 2), aber nicht auf der Strecke. Mit ${t} = 2 gehst du zweimal den Vektor ${n("AB")}, also über B hinaus. Auf der Strecke liegen nur Punkte mit 0 ≤ ${t} ≤ 1.` },
      { text: `(${m}4 | ${m}3 | 4)`, correct: false,
        fb: `Dieser Punkt liegt auf der Geraden (${t} = ${m}1), aber nicht auf der Strecke. Ein negatives ${t} bedeutet: Du gehst von A aus in die Gegenrichtung, also weg von B.` },
      { text: `(4 | 1 | 0)`, correct: true,
        fb: `Alle drei Zeilen liefern ${t} = ${f(1,3)}. Wegen 0 ≤ ${f(1,3)} ≤ 1 liegt der Punkt auf der Strecke, genau ein Drittel des Weges von A nach B.` },
      { text: `(5 | 2 | 0)`, correct: false,
        fb: `Dieser Punkt liegt nicht einmal auf der Geraden. Aus der x-Zeile folgt ${t} = 0,5, aus der y-Zeile ${t} = ${f(2,3)}. Das passt nicht zusammen.` }
    ]
  },
  {
    topic: "Frage 4 · Geschwindigkeit",
    stem: `Ein Schiff fährt entlang ${xv} = ${v(5,0,0)}&nbsp;+&nbsp;${t}&nbsp;· ${v(12,5,0)}<br>(${t} in Stunden, Koordinaten in km). Wie schnell ist das Schiff?`,
    options: [
      { text: `13 km/h`, correct: true,
        fb: `In einer Stunde legt das Schiff genau den Richtungsvektor zurück. Seine Länge ist √(12² + 5²) = √169 = 13 km. Die Geschwindigkeit beträgt also 13 km/h.` },
      { text: `17 km/h`, correct: false,
        fb: `Du hast die Koordinaten addiert. Die Länge eines Vektors berechnest du aber mit dem Satz des Pythagoras: √(12² + 5² + 0²).` },
      { text: `12 km/h`, correct: false,
        fb: `Das ist nur die Bewegung in x-Richtung. Das Schiff bewegt sich aber gleichzeitig auch in y-Richtung. Die Geschwindigkeit ist die Länge des <b>ganzen</b> Richtungsvektors.` },
      { text: `5 km/h`, correct: false,
        fb: `Die 5 steckt im Stützvektor. Sie gibt die Startposition an, nicht die Geschwindigkeit. Die Geschwindigkeit steckt im Richtungsvektor.` }
    ]
  },
  {
    topic: "Frage 5 · Schnittpunkt oder Zusammenstoß?",
    stem: `Die Flugbahnen zweier Flugzeuge schneiden sich im Punkt S.<br>Flugzeug 1 ist um 10:15 Uhr in S, Flugzeug 2 um 10:45 Uhr. Was folgt daraus?`,
    options: [
      { text: `Sie stoßen um 10:30 Uhr zusammen.`, correct: false,
        fb: `Den Mittelwert der Zeiten zu bilden hat keine Bedeutung. Um 10:30 Uhr ist Flugzeug 1 schon an S vorbei und Flugzeug 2 noch nicht dort.` },
      { text: `Sie stoßen in S zusammen.`, correct: false,
        fb: `Dass sich die Bahnen schneiden, reicht nicht. Für einen Zusammenstoß müssen beide Flugzeuge <b>zur gleichen Zeit</b> am gleichen Ort sein. Hier liegen 30 Minuten dazwischen.` },
      { text: `Die Bahnen schneiden sich doch nicht.`, correct: false,
        fb: `Doch, das ist in der Aufgabe gegeben: Beide Flugzeuge kommen durch S. Es geht hier nicht um die Bahnen, sondern um die Zeitpunkte.` },
      { text: `Sie stoßen nicht zusammen, weil sie zu verschiedenen Zeiten in S sind.`, correct: true,
        fb: `Die Bahnen kreuzen sich, aber die Flugzeuge sind nicht gleichzeitig dort. Merke: Schnittpunkt der Bahnen ≠ Zusammenstoß. Für einen Zusammenstoß braucht man denselben Ort <b>und</b> dieselbe Zeit.` }
    ]
  }
];

/* ---------- Zustand ---------- */
const letters = ["A", "B", "C", "D", "E", "F"];
const opened = questions.map(() => new Set());  // geöffnete Feedbacks je Frage
let current = 0;
let justOpened = -1;
let scale = 1;
try { const s = parseFloat(localStorage.getItem("dq-scale")); if (s >= 0.5 && s <= 2.5) scale = s; } catch (e) {}

const $ = id => document.getElementById(id);

function render() {
  const q = questions[current];
  let html = `<div class="topic">${q.topic}</div><div class="stem">${q.stem}</div><div class="opts">`;
  q.options.forEach((o, i) => {
    const isOpen = opened[current].has(i);
    const cls = isOpen ? (o.correct ? "correct" : "wrong") : "";
    html += `<div class="opt ${cls}" data-i="${i}">
      <button class="opt-btn" aria-expanded="${isOpen}" title="Taste ${letters[i]}">
        <span class="badge">${letters[i]}</span><span>${o.text}</span>
      </button>
      ${isOpen ? `<div class="fb ${o.correct ? "correct" : "wrong"}${i === justOpened ? " new" : ""}"><span class="verdict">${o.correct ? "✔ Richtig!" : "✘ Leider falsch."}</span>${o.fb}</div>` : ""}
    </div>`;
  });
  html += `</div>`;
  $("content").innerHTML = html;

  $("content").querySelectorAll(".opt").forEach(el => {
    el.querySelector(".opt-btn").addEventListener("click", () => toggle(+el.dataset.i));
  });

  $("counter").textContent = `Frage ${current + 1} / ${questions.length}`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === questions.length - 1;
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === current));
}

function toggle(i) {
  const s = opened[current];
  const wasOpen = s.has(i);
  s.clear();
  if (!wasOpen) s.add(i);
  justOpened = wasOpen ? -1 : i;
  render();
  justOpened = -1;
  if (!wasOpen) {
    const fb = $("content").querySelector(`.opt[data-i="${i}"] .fb`);
    if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

function go(i) {
  if (i < 0 || i >= questions.length) return;
  current = i;
  render();
  $("main").scrollTop = 0;
}

function setScale(s) {
  scale = Math.min(2.5, Math.max(0.5, Math.round(s * 10) / 10));
  document.documentElement.style.setProperty("--scale", scale);
  $("zoomLabel").textContent = Math.round(scale * 100) + " %";
  try { localStorage.setItem("dq-scale", scale); } catch (e) {}
}

/* ---------- Bedienelemente ---------- */
questions.forEach((_, i) => {
  const d = document.createElement("button");
  d.className = "dot"; d.title = `Frage ${i + 1}`; d.setAttribute("aria-label", `Frage ${i + 1}`);
  d.addEventListener("click", () => go(i));
  $("dots").appendChild(d);
});
$("prev").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("zoomIn").addEventListener("click", () => setScale(scale + 0.1));
$("zoomOut").addEventListener("click", () => setScale(scale - 0.1));
$("reset").addEventListener("click", () => { opened[current].clear(); render(); });

/* Tastatur & Presenter-Fernbedienung */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") { e.preventDefault(); go(current + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(current - 1); }
  else if (k === "+" || k === "=") setScale(scale + 0.1);
  else if (k === "-" || k === "_") setScale(scale - 0.1);
  else if (k === "0") setScale(1);
  else {
    const idx = letters.indexOf(k.toUpperCase());
    if (idx >= 0 && idx < questions[current].options.length) toggle(idx);
  }
});

setScale(scale);
render();
</script>
</body>
</html>
